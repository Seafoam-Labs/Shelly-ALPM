# Optional overrides for Shelly's in-process AUR builder.
#
#      _          _ _       _           _ _     _                   __
#  ___| |__   ___| | |_   _| |__  _   _(_) | __| |  ___ ___  _ __  / _|
# / __| '_ \ / _ \ | | | | | '_ \| | | | | |/ _` | / __/ _ \| '_ \| |_
# \__ \ | | |  __/ | | |_| | |_) | |_| | | | (_| || (_| (_) | | | |  _|
# |___/_| |_|\___|_|_|\__, |_.__/ \__,_|_|_|\__,_(_)___\___/|_| |_|_|
#                     |___/
# Shelly has compiled defaults for every setting below.  This installed file is
# deliberately inert: uncomment only the values that should be system-wide
# overrides.  Per-user overrides belong in
# $XDG_CONFIG_HOME/shelly/shellybuild.conf.
#
# Precedence, lowest to highest, merged field by field:
#   compiled defaults
#   /etc/shellybuild.conf
#   $XDG_CONFIG_HOME/shelly/shellybuild.conf (or ~/.config/shelly/...)
#
# Host classes
# ------------
# Two useful baselines are shown in the comments below:
#
#   standard  Portable x86-64 values: -march=x86-64 -mtune=generic,
#             distro hardening flags, and -j2.  Use this for packages that
#             may be installed on other machines.
#   native   -march=native, -O3, and a host-specific -jN. Faster on the
#            machine that builds the package, but not portable across hosts
#            and not reproducible from a shared build recipe.
#
# Every value is optional.  Adding a key to a section replaces only that key;
# unrelated keys keep the value from the layer below.

[build]
# Target architecture and toolchain triple.  This is also what PKGBUILDs see
# as $CARCH, so keep it at the baseline the packages declare (usually
# "x86_64") even when compiler flags target a newer CPU level.
# carch = "x86_64"
# chost = "x86_64-pc-linux-gnu"

# Compiler, preprocessor, and linker flags.  Arrays are joined with spaces
# only when a child process starts.  Compiled default: [].
# cppflags = []
# cppflags = ["-D_GNU_SOURCE"]

# Compiled default: ["-O2", "-pipe"].
#
# standard host class (portable, recommended base):
# cflags = ["-march=x86-64", "-mtune=generic", "-O2", "-pipe", "-fno-plt", "-fexceptions", "-Wp,-D_FORTIFY_SOURCE=3", "-Wformat", "-Werror=format-security", "-fstack-clash-protection", "-fcf-protection", "-fno-omit-frame-pointer", "-mno-omit-leaf-frame-pointer"]
#
# native host class (faster locally, not portable):
# cflags = ["-march=native", "-O3", "-pipe", "-fno-plt", "-fexceptions", "-Wp,-D_FORTIFY_SOURCE=3", "-Wformat", "-Werror=format-security", "-fstack-clash-protection", "-fcf-protection"]

# C++ flags usually repeat CFLAGS plus the standard-library assertion check.
# Compiled default: ["-O2", "-pipe"].
# standard host class (portable, recommended base):
# cxxflags = ["-march=x86-64", "-mtune=generic", "-O2", "-pipe", "-fno-plt", "-fexceptions", "-Wp,-D_FORTIFY_SOURCE=3", "-Wformat", "-Werror=format-security", "-fstack-clash-protection", "-fcf-protection", "-fno-omit-frame-pointer", "-mno-omit-leaf-frame-pointer", "-Wp,-D_GLIBCXX_ASSERTIONS"]
# native host class (faster locally, not portable):
# cxxflags = ["-march=native", "-O3", "-pipe", "-fno-plt", "-fexceptions", "-Wp,-D_FORTIFY_SOURCE=3", "-Wformat", "-Werror=format-security", "-fstack-clash-protection", "-fcf-protection", "-Wp,-D_GLIBCXX_ASSERTIONS"]

# Linker flags.  Compiled default:
# ["-Wl,-z,relro", "-Wl,-z,now"].
# standard host class (recommended):
# ldflags = ["-Wl,-O1", "-Wl,--sort-common", "-Wl,--as-needed", "-Wl,-z,relro", "-Wl,-z,now", "-Wl,-z,pack-relative-relocs"]

# Flags appended when the PKGBUILD enables the "lto" package option, which is
# on by default.  Compiled default: ["-flto=auto"].
# ltoflags = ["-flto=auto"]

# Parallel make settings.  Compiled default: ["-j2"], matching the standard
# host class default.
# The value is literal: $(nproc), $HOME, and ~ are not expanded.  Set it to
# your processor count for local builds, for example ["-j16"] on a 16-core
# CPU.  Watch memory use for very large C++ builds, and lower the job count
# for packages with parallel-build races.  [] removes MAKEFLAGS entirely,
# which serializes make.
# makeflags = ["-j2"]
# makeflags = ["-j16"]

# Run check() by default when a PKGBUILD defines it.  Default: true.
# Use "shelly build --no-check" for a package with broken tests instead of
# disabling checks system-wide.
# check = true

# Compiler cache and distributed compilation wrappers.  Shelly does not
# install these tools; enable them only when the wrapper directories exist.
# Defaults: false.
# ccache = false
# distcc = false
# distcc_hosts = ["localhost", "192.0.2.10"]

# Directories prepended to the fixed build PATH, in order.  Entries must be
# absolute, exist, and be searchable by the unprivileged build user.  No shell,
# $HOME, or ~ expansion.  Compiled default: [].
# extra_path = ["/opt/toolchain/bin", "/home/your-user/.cargo/bin"]

# Literal environment variables for unprivileged native build subprocesses
# (also isolated builds).  The user table replaces the system table; an empty
# [build.env] table clears assignments (the inline form env = {} is rejected
# by the TOML parser).  No shell, $HOME, or ~ expansion.  Use extra_path and
# the dedicated flag settings instead of PATH, SRCDEST, and compiler flags;
# identity and process-startup variables are reserved.
# env = { JAVA_HOME = "/usr/lib/jvm/default", CARGO_HOME = "/home/your-user/.cargo" }
# [build.env]
# JAVA_HOME = "/usr/lib/jvm/default"
# CARGO_HOME = "/home/your-user/.cargo"
# LANG = "C.UTF-8"

[package]
# Name and address recorded in .PKGINFO.  Default: "Unknown Packager".
# packager = "Your Name <you@example.org>"

# Archive format and compression.  Supported extensions:
# ".pkg.tar.zst" (default), ".pkg.tar.gz", ".pkg.tar.xz", ".pkg.tar.bz2".
# extension = ".pkg.tar.zst"

# Architecture written into built packages (.PKGINFO arch, .BUILDINFO pkgarch,
# and the file name), the standard PACKAGECARCH equivalent.  Only packaging
# uses it: PKGBUILDs are still evaluated and checked with [build] carch, so
# packages declaring arch=('x86_64') build normally and come out labelled
# x86_64_v3.
# arch=('any') packages stay "any".  Unset means [build] carch.  Installing
# the result needs pacman to accept it: CachyOS pacman and Shelly expand
# Architecture = auto to x86_64_v2/v3/v4; stock Arch pacman needs it listed,
# e.g. Architecture = x86_64 x86_64_v3.
# Values must match [A-Za-z0-9_]+ and must not be "any".
# carch = "x86_64_v3"

# Optional compression preset, from 1 (conservative) to 5 (maximum).
# The extension selects the format; each preset maps to a backend level:
# Level  Preset        zstd  gzip  xz  bzip2  Intended tradeoff
# 1      Conservative    1     1   0      1  Low resource use; larger packages
# 2      Fast            3     3   3      3  Quick builds; reasonable compression
# 3      Balanced        6     6   6      5  Recommended starting point
# 4      Compact        12     8   7      7  Favor smaller packages
# 5      Maximum        19     9   9      9  Highest compression effort offered
# All presets are lossless.  Reliability here means reducing memory pressure
# and build time.  Higher levels generally use more resources for smaller
# packages, but do not guarantee smaller output for every input.
# xz and zstd request one compression worker for every explicit preset.
# Precedence: CLI --compression-level > user config > system config.
# Omitting the setting everywhere retains the library's current defaults;
# level 3 is the recommended explicit starting point.
# compression_level = 3

# Global package options.  Prefix a name with "!" to disable it, and remember
# that PKGBUILD options=() values merge over these settings.
# Valid names:
#   strip       strip binaries, shared objects, and static archives
#   docs        keep documentation directories (accepted; no tidy step)
#   libtool     keep libtool .la files (accepted; no tidy step)
#   staticlibs  keep static libraries (accepted; no tidy step)
#   emptydirs   keep empty directories (accepted; no tidy step)
#   zipman      compress man/info pages (accepted; no tidy step)
#   purge       remove usr/info/dir, usr/share/info/dir, *.packlist, *.pod
#   debug       debug package support (accepted; no tidy step)
#   lto         add ltoflags to the build environment
#   autodeps    automatic dependency generation (accepted; no tidy step)
#   buildflags  pass CPPFLAGS, CFLAGS, CXXFLAGS, and LDFLAGS
#   makeflags   pass MAKEFLAGS
# Compiled default:
# ["strip", "docs", "emptydirs", "zipman", "purge", "lto"]
# options = ["strip", "docs", "emptydirs", "zipman", "purge", "lto"]
# Common variants:
# options = ["strip", "emptydirs", "zipman", "purge", "lto", "!docs"]
# options = ["strip", "docs", "emptydirs", "zipman", "purge", "!lto"]

# Arguments passed to strip for each file class.
# Defaults: ["--strip-all"], ["--strip-debug"], ["--strip-unneeded"].
# strip_binaries = ["--strip-all"]
# strip_shared = ["--strip-debug"]
# strip_static = ["--strip-unneeded"]

# Detached OpenPGP signature next to every published package.  sign_key is
# the GPG key id or fingerprint passed to --local-user; when unset, GPG uses
# the default key from the invoking user's keyring.  An explicitly configured
# sign_key must not be empty.  Defaults: false and "".
# sign = false
# sign_key = "0000000000000000000000000000000000000000"

[destinations]
# All paths must be absolute.  Leaving a key unset keeps Shelly's per-user
# build, package, source, and log locations, which already work without extra
# permissions.  The system-wide examples below require the directories to
# exist and to be writable by the unprivileged build user.
#
# build = "/var/tmp/shellybuild"
# packages = "/var/cache/shelly/packages"
# sources = "/var/cache/shelly/sources"
# logs = "/var/log/shelly/build"

[sandbox]
# Confine untrusted PKGBUILD lifecycle steps (prepare, pkgver, build, check,
# verify, package) with the kernel's Landlock LSM.  The build work directory,
# $startdir, /usr, /etc, /opt, /proc, /sys, /tmp, and common /dev nodes stay
# available; everything else, including $HOME, is denied.  Builds fail rather
# than run unprotected when Landlock is unavailable.  Default: false.
# enabled = true

# Additional absolute paths granted to sandboxed steps.  Add read-only paths
# for toolchain or package caches and read-write paths for caches that must be
# updated.  Paths must exist in the guest for --isolated builds.
# extra_read = ["/home/your-user/.cargo", "/home/your-user/.cache/ccache"]
# extra_write = ["/home/your-user/.cargo", "/home/your-user/.cache/ccache"]