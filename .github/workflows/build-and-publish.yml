name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, development ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm zig flatpak base-devel gtk4 clang glibc git vala meson ninja json-glib

      # Checkout only after git is installed
      - uses: actions/checkout@v6

      - name: Build cli & test
        run: cd Shelly.Cli.Zig && zig build test

      - name: Build gtk gui & test
        run: cd Shelly.Ui.Gtk && zig build test

      - name: Build keys & test
        run: cd Shelly.Key && zig build test

      - name: Build Shelly.Notifications
        run: |
          meson setup build-notify Shelly.Notifications
          meson compile -C build-notify
