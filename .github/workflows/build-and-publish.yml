name: Build and Test
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, development ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      http: ${{ steps.filter.outputs.http }}
      packagemanager: ${{ steps.filter.outputs.packagemanager }}
      cli: ${{ steps.filter.outputs.cli }}
      gtk: ${{ steps.filter.outputs.gtk }}
      devario: ${{ steps.filter.outputs.devario }}
      tui: ${{ steps.filter.outputs.tui }}
      key: ${{ steps.filter.outputs.key }}
      rlpm: ${{ steps.filter.outputs.rlpm }}
      notifications: ${{ steps.filter.outputs.notifications }}
      pkgbuild: ${{ steps.filter.outputs.pkgbuild }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Shelly.Flatpak.Backend/**'
              - 'Shelly.Diagnostics/**'
            http:
              - 'Shelly.Http/**'
            packagemanager:
              - 'Shelly.Download/**'
              - 'Shelly.Http/**'
              - 'Shelly.PackageManager/**'
              - 'Shelly.Rlpm/**'
              - 'Shelly.Key/**'
              - 'Shelly.Diagnostics/**'
            cli:
              - 'Shelly.Download/**'
              - 'Shelly.Http/**'
              - 'Shelly.Cli.Zig/**'
              - 'Shelly.Diagnostics/**'
              - 'Shelly.PackageManager/**'
              - 'Shelly.Flatpak.Backend/**'
              - 'scripts/**'
            gtk:
              - 'Shelly.Http/**'
              - 'Shelly.Ui.Gtk/**'
              - 'Shelly.Diagnostics/**'
            devario:
              - 'Shelly.Ui.Gtk/src/devario/**'
            tui:
              - 'Shelly.Tui/**'
              - 'Shelly.Diagnostics/**'
            key:
              - 'Shelly.Key/**'
              - 'Shelly.Diagnostics/**'
            rlpm:
              - 'Shelly.Download/**'
              - 'Shelly.Http/**'
              - 'Shelly.Rlpm/**'
              - 'Shelly.PackageManager/src/rlpm/**'
              - 'Shelly.PackageManager/src/shared/operation_context.zig'
              - 'Shelly.PackageManager/build.zig'
              - 'Shelly.PackageManager/build.zig.zon'
              - 'Shelly.Key/**'
              - 'Shelly.Diagnostics/**'
              - '.github/workflows/build-and-publish.yml'
            notifications:
              - 'Shelly.Notifications.Zig/**'
              - 'Shelly.Diagnostics/**'
            pkgbuild:
              - 'PKGBUILD*'
              - '*.desktop'
              - 'shelly-flatpak-integrate'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel glibc git libarchive
      - uses: actions/checkout@v6
      - name: Build and test Flatpak backend
        run: |
          cd Shelly.Flatpak.Backend
          zig build
          zig build test
          zig build abi-test
          zig build integration-test

  http:
    needs: changes
    if: ${{ needs.changes.outputs.http == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git
      - uses: actions/checkout@v6
      - name: Build and test HTTP client
        run: |
          cd Shelly.Http
          zig build
          zig build test

  packagemanager:
    needs: changes
    if: ${{ needs.changes.outputs.packagemanager == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel glibc git libarchive curl sqlite
      - uses: actions/checkout@v6
      - name: Build and test PackageManager
        run: |
          cd Shelly.PackageManager
          zig build
          zig build test
          zig build downloader-test
          zig build flatpak-test

  cli:
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel glibc git libarchive curl sqlite ripgrep
      - uses: actions/checkout@v6
      - name: Test shared diagnostics
        run: cd Shelly.Diagnostics && zig build test
      - name: Build CLI and test
        run: |
          cd Shelly.Cli.Zig
          zig build
          zig build test
      - name: Build backend for boundary check
        run: |
          cd Shelly.Flatpak.Backend
          zig build
      - name: Verify optional Flatpak boundary
        run: |
          scripts/check-flatpak-separation.sh \
            Shelly.Cli.Zig/zig-out/bin/shelly \
            Shelly.Flatpak.Backend/zig-out/lib/libshelly-flatpak-backend.so.1
          Shelly.Cli.Zig/zig-out/bin/shelly --help >/dev/null
          Shelly.Cli.Zig/zig-out/bin/shelly --version >/dev/null
          Shelly.Cli.Zig/zig-out/bin/shelly utility --completions bash >/dev/null

  gtk:
    needs: changes
    if: ${{ needs.changes.outputs.gtk == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel gtk4 glibc git vala xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v6
      - name: Build GTK GUI and test without a display
        run: |
          cd Shelly.Ui.Gtk
          zig build
          env -u DISPLAY -u WAYLAND_DISPLAY zig build test
      - name: Test GTK widgets with a virtual display
        run: |
          cd Shelly.Ui.Gtk
          GDK_BACKEND=x11 GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a zig build test

  gtk-devario:
    needs: changes
    if: ${{ needs.changes.outputs.devario == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel gtk4 glibc git
      - uses: actions/checkout@v6
      - name: Build the Devario GTK variant
        run: |
          cd Shelly.Ui.Gtk
          zig build -Ddevario=true

  tui:
    needs: changes
    if: ${{ needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git
      - uses: actions/checkout@v6
      - name: Build TUI and test
        run: |
          cd Shelly.Tui
          zig build
          zig build test

  key:
    needs: changes
    if: ${{ needs.changes.outputs.key == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git
      - uses: actions/checkout@v6
      - name: Build keys & test
        run: |
          cd Shelly.Key
          zig build
          zig build test

  native-backends:
    needs: changes
    if: ${{ needs.changes.outputs.packagemanager == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.rlpm == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        libalpm: ['true', 'false']
        optimize: [Debug, ReleaseSafe]
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git libarchive sqlite gnupg curl ripgrep
      - uses: actions/checkout@v6
      - name: Remove libalpm development and runtime files in this disposable container
        if: ${{ matrix.libalpm == 'false' }}
        shell: bash
        run: |
          mkdir -p /tmp/disabled-libalpm
          shopt -s nullglob
          for file in /usr/include/alpm.h /usr/include/alpm_list.h /usr/lib/libalpm.so* /usr/lib/pkgconfig/libalpm.pc; do
            mv "$file" /tmp/disabled-libalpm/
          done
          ! pkg-config --exists libalpm
          ! test -e /usr/include/alpm.h
          ! test -e /usr/lib/libalpm.so
      - name: Test loopback downloads and temporary-keyring signing
        working-directory: Shelly.PackageManager
        run: zig build native-environment-test -Dlibalpm=${{ matrix.libalpm }} -Doptimize=${{ matrix.optimize }} --summary all
      - name: Test selection, private-root transactions, copied Shelly worker modes and ELF dependencies
        run: scripts/test-native-backends.sh '${{ matrix.libalpm }}' '${{ matrix.optimize }}'

  rlpm:
    needs: changes
    if: ${{ needs.changes.outputs.rlpm == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: archlinux:latest
      # Action and executor integration tests use nested namespaces, disposable chroots and private tmpfs mounts.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --cap-add SYS_ADMIN
    strategy:
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig base-devel glibc git libarchive sqlite gnupg curl util-linux
      - uses: actions/checkout@v6
      - name: Build and run RLPM unit and disposable-root action tests
        working-directory: Shelly.Rlpm
        run: |
          zig version
          zig build -Doptimize=${{ matrix.optimize }}
          zig build test test-actions test-executor-integration test-download check-download-sandbox -Doptimize=${{ matrix.optimize }} --summary all
      - name: Verify shared transfer and queue regressions
        working-directory: Shelly.Download
        run: zig build test check-sandbox -Doptimize=${{ matrix.optimize }} --summary all
      - name: Verify GPG trust, key imports and signed archives
        if: ${{ matrix.optimize == 'Debug' }}
        working-directory: Shelly.Rlpm
        run: zig build test-signature --summary all
      - name: Test RLPM deferred questions and cancellation adapter
        working-directory: Shelly.PackageManager
        run: zig build rlpm-adapter-test -Drlpm-adapter-only=true -Doptimize=${{ matrix.optimize }} --summary all

  notifications:
    needs: changes
    if: ${{ needs.changes.outputs.notifications == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel glibc git zig clang gettext
      - uses: actions/checkout@v6
      - name: Build Shelly.Notifications.Zig
        run: |
          cd Shelly.Notifications.Zig
          zig build --verbose \
            --prefix ../zig-out-notifications \
            -Dcpu=baseline \
            -Doptimize=ReleaseSafe

  pkgbuild:
    needs: changes
    if: ${{ needs.changes.outputs.pkgbuild == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm desktop-file-utils
      - uses: actions/checkout@v6
      - name: Validate Arch package recipes
        run: bash -n PKGBUILD PKGBUILD-git PKGBUILD-bin PKGBUILD-cli
      - name: Validate packaged desktop entries
        run: |
          desktop-file-validate com.shellyorg.shelly.desktop com.shellyorg.shelly-notifications.desktop
          bash -n shelly-flatpak-integrate

  all-pass:
    if: ${{ always() }}
    needs:
      - backend
      - http
      - packagemanager
      - cli
      - gtk
      - gtk-devario
      - tui
      - key
      - notifications
      - pkgbuild
      - native-backends
      - rlpm
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job failed or was cancelled."
              exit 1
            fi
          done
          echo "All triggered jobs passed (skipped jobs are OK)."
