name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, development ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel gtk4 clang glibc git libarchive vala meson ninja json-glib ripgrep

      # Checkout only after git is installed
      - uses: actions/checkout@v6

      - name: Build and test Flatpak backend
        run: |
          cd Shelly.Flatpak.Backend
          zig build
          zig build test
          zig build abi-test
          zig build integration-test

      - name: Build and test PackageManager
        run: |
          cd Shelly.PackageManager
          zig build
          zig build test
          zig build flatpak-test

      - name: Build CLI and test
        run: |
          cd Shelly.Cli.Zig
          zig build
          zig build test

      - name: Verify optional Flatpak boundary
        run: |
          scripts/check-flatpak-separation.sh \
            Shelly.Cli.Zig/zig-out/bin/shelly \
            Shelly.Flatpak.Backend/zig-out/lib/libshelly-flatpak-backend.so.1
          Shelly.Cli.Zig/zig-out/bin/shelly --help >/dev/null
          Shelly.Cli.Zig/zig-out/bin/shelly --version >/dev/null
          Shelly.Cli.Zig/zig-out/bin/shelly utility --completions bash >/dev/null

      - name: Build GTK GUI and test
        run: |
          cd Shelly.Ui.Gtk
          zig build
          zig build test

      - name: Build TUI and test
        run: |
          cd Shelly.Tui
          zig build
          zig build test

      - name: Build keys & test
        run: |
          cd Shelly.Key
          zig build
          zig build test

      - name: Build Shelly.Notifications
        run: |
          meson setup build-notify Shelly.Notifications
          meson compile -C build-notify

      - name: Validate Arch package recipes
        run: bash -n PKGBUILD PKGBUILD-git PKGBUILD-bin PKGBUILD-cli
