name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, development ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm dotnet-sdk zig base-devel gtk4 clang glibc git vala meson ninja json-glib

      # Checkout only after git is installed
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Build Shelly.Key (smoke)
        run: cd Shelly.Key && zig build -p ../publish/key

      - name: Build Shelly.Notifications
        run: |
          meson setup build-notify Shelly.Notifications
          meson compile -C build-notify
