name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm zig flatpak base-devel gtk4 wayland clang glibc git gettext libarchive curl vala meson ninja json-glib ripgrep

      # Checkout only after git is installed in the container.
      - uses: actions/checkout@v6

      - name: Build and test Flatpak backend
        run: |
          (cd Shelly.Flatpak.Backend && zig build \
            --prefix ../publish/build-flatpak-backend \
            -Dcpu=baseline \
            -Doptimize=ReleaseSafe)
          (cd Shelly.Flatpak.Backend && zig build test)
          (cd Shelly.Flatpak.Backend && zig build abi-test)
          (cd Shelly.Flatpak.Backend && zig build integration-test)

      - name: Test HTTP client
        run: cd Shelly.Http && zig build test

      - name: Test PackageManager
        run: |
          (cd Shelly.PackageManager && zig build test)
          (cd Shelly.PackageManager && zig build flatpak-test)

      - name: Publish Flatpak backend
        run: |
          mkdir -p publish/shelly-flatpak-backend
          install -Dm755 \
            publish/build-flatpak-backend/lib/libshelly-flatpak-backend.so.1.0.0 \
            publish/shelly-flatpak-backend/libshelly-flatpak-backend.so.1.0.0
          ln -s libshelly-flatpak-backend.so.1.0.0 \
            publish/shelly-flatpak-backend/libshelly-flatpak-backend.so.1
          tar -czf publish/Shelly-Flatpak-Backend-linux-x64.tar.gz \
            -C publish/shelly-flatpak-backend .

      - name: Publish Shelly.Cli
        run: |
          mkdir -p publish/shelly-cli
          (cd Shelly.Cli.Zig && zig build --prefix ../publish/build-cli -Dcpu=baseline -Doptimize=ReleaseSmall)
          (cd Shelly.Cli.Zig && zig build test)
          install -Dm755 publish/build-cli/bin/shelly publish/shelly-cli/shelly
          # Generate completion scripts from the freshly built binary.
          publish/shelly-cli/shelly utility --completions fish > publish/shelly-cli/shelly.fish
          publish/shelly-cli/shelly utility --completions zsh  > publish/shelly-cli/_shelly
          tar -czf publish/Shelly-CLI-linux-x64.tar.gz -C publish/shelly-cli .

      - name: Verify optional Flatpak boundary
        run: |
          scripts/check-flatpak-separation.sh \
            publish/shelly-cli/shelly \
            publish/shelly-flatpak-backend/libshelly-flatpak-backend.so.1

      - name: Test TUI consumer
        run: |
          cd Shelly.Tui
          zig build
          zig build test

      - name: Publish Shelly.Gtk
        run: |
          mkdir -p publish/shelly-ui
          (cd Shelly.Ui.Gtk && zig build --prefix ../publish/build-ui -Dflatpak-backend-package=shelly-flatpak-backend-bin -Dcpu=baseline -Doptimize=ReleaseSafe)
          install -Dm755 publish/build-ui/bin/Shelly_Ui_Gtk publish/shelly-ui/shelly-ui
          install -m644 assets/shellylogo.png publish/shelly-ui/
          install -m644 assets/shellylogo-tray.png publish/shelly-ui/
          install -m644 assets/shellylogo-update.png publish/shelly-ui/
          # Also bundle the CLI binary for convenience.
          install -m755 publish/shelly-cli/shelly publish/shelly-ui/

      - name: Compile and bundle translations
        run: |
          mkdir -p publish/shelly-ui/locale
          for po_file in Shelly.Ui.Gtk/po/*.po; do
            if [ -f "$po_file" ]; then
              lang=$(basename "$po_file" .po)
              mkdir -p "publish/shelly-ui/locale/$lang/LC_MESSAGES"
              msgfmt "$po_file" -o "publish/shelly-ui/locale/$lang/LC_MESSAGES/shelly-ui.mo"
            fi
          done

      - name: Compile and bundle tray service translations
        run: |
          mkdir -p publish/shelly-ui/locale
          for po_file in Shelly.Notifications.Zig/po/*.po; do
            if [ -f "$po_file" ]; then
              lang=$(basename "$po_file" .po)
              mkdir -p "publish/shelly-ui/locale/$lang/LC_MESSAGES"
              msgfmt "$po_file" -o "publish/shelly-ui/locale/$lang/LC_MESSAGES/shelly-notifications.mo"
            fi
          done

      - name: Publish Shelly.Notifications.Zig
        run: |
          (cd Shelly.Notifications.Zig && zig build --verbose \
            --prefix ../publish/build-notifications \
            -Dcpu=baseline \
            -Doptimize=ReleaseSafe)
          # Bundle Notifications into the UI directory.
          install -Dm755 publish/build-notifications/bin/shelly-notifications publish/shelly-ui/shelly-notifications

      - name: Publish Shelly.Key
        run: |
          mkdir -p publish/shelly-key
          (cd Shelly.Key && zig build --prefix ../publish/build-key -Dcpu=baseline -Doptimize=ReleaseSmall)
          install -Dm755 publish/build-key/bin/shelly-key publish/shelly-key/shelly-key
          # Bundle Key into the UI directory so it ends up in Shelly-ALPM-linux-x64.tar.gz.
          install -m755 publish/shelly-key/shelly-key publish/shelly-ui/

      - name: Package Shelly.Key standalone
        run: |
          tar -czf publish/Shelly-Key-linux-x64.tar.gz -C publish/shelly-key .

      - name: Bundle Shelly-ALPM
        run: |
          cp publish/shelly-cli/shelly.fish publish/shelly-ui/
          cp publish/shelly-cli/_shelly     publish/shelly-ui/
          tar -czf publish/Shelly-ALPM-linux-x64.tar.gz -C publish/shelly-ui .

      - name: Copy standalone completions
        run: |
          cp publish/shelly-cli/shelly.fish publish/shelly.fish
          cp publish/shelly-cli/_shelly     publish/_shelly

      - name: Generate SHA256 checksums
        run: |
          cd publish
          # Download the source tarball from GitHub and generate its checksum.
          VERSION=${GITHUB_REF#refs/tags/}
          curl -sL "https://github.com/ZoeyErinBauer/Shelly-ALPM/archive/${VERSION}.tar.gz" -o "source-${VERSION}.tar.gz"
          sha256sum "source-${VERSION}.tar.gz" | sed "s/source-${VERSION}.tar.gz/${VERSION}.tar.gz/" > SHA256SUMS.txt
          # Add binary tarballs and completions checksums.
          sha256sum Shelly-ALPM-linux-x64.tar.gz Shelly-CLI-linux-x64.tar.gz Shelly-Flatpak-Backend-linux-x64.tar.gz Shelly-Key-linux-x64.tar.gz shelly.fish _shelly >> SHA256SUMS.txt
          rm "source-${VERSION}.tar.gz"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/Shelly-ALPM-linux-x64.tar.gz
            publish/Shelly-CLI-linux-x64.tar.gz
            publish/Shelly-Flatpak-Backend-linux-x64.tar.gz
            publish/Shelly-Key-linux-x64.tar.gz
            publish/shelly.fish
            publish/_shelly
            publish/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Seafoam Labs website
        uses: digitalocean/app_action/deploy@v2
        with:
          app_name: seafoam-labs-website
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
