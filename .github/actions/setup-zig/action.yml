name: Set up project Zig
description: Install Zig from the Arch repositories
runs:
  using: composite
  steps:
    # Jobs run pacman -Syu before this action, so the package database is
    # fresh and zig comes from the Arch mirrors instead of ziglang.org.
    - name: Install Zig
      shell: bash
      run: |
        pacman -S --needed --noconfirm zig
        zig version
