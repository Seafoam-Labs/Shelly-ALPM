name: Set up project Zig
description: Install verified official Zig 0.17.1
runs:
  using: composite
  steps:
    - name: Install Zig 0.17.1
      shell: bash
      run: |
        set -euo pipefail
        # Checksums from https://ziglang.org/download/index.json (0.17.1).
        case "$(uname -m)" in
          x86_64)
            arch=x86_64
            sha256=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
            ;;
          aarch64)
            arch=aarch64
            sha256=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
            ;;
          *) echo 'Unsupported Zig runner architecture' >&2; exit 1 ;;
        esac
        archive="zig-${arch}-linux-0.17.1.tar.xz"
        destination="${RUNNER_TEMP}/shelly-zig-0.17.1"
        mkdir -p "$destination"
        curl --fail --location --retry 3 "https://ziglang.org/download/0.17.1/${archive}" -o "$destination/$archive"
        printf '%s  %s\n' "$sha256" "$destination/$archive" | sha256sum --check --strict
        tar -xJf "$destination/$archive" -C "$destination"
        compiler="$destination/zig-${arch}-linux-0.17.1"
        test "$("$compiler/zig" version)" = 0.17.1
        echo "$compiler" >> "$GITHUB_PATH"